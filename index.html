<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de dados</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500&display=swap');
    </style>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="dado.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js" defer> </script>

</head>
<body>
    <div id="contenedorPrincipal">
        <div id="encabezado">
            <h1 id = "juego">Juego de dados</h1>
            <h2 id ="tuDinero">Tienes $50 como cantidad inicial</h2>
        </div>

        <div id="moduloJuego">
            <label for = "ingresaNumero">¿A qué número le apuestas?</label>
            <input
                type="text"
                id="ingresaNumero"
                placeholder="Número a apostar">

            <label for = "ingresaCantidad">¿Cuánto deseas apostar?</label>
            <input
                type="text"
                id="ingresaCantidad"
                placeholder="Dinero">

            <h3 id = "lanzar">Pulsa el botón para lanzar el dado</h3>
            <button id = "botonLanzaDado">
                Lanzar
            </button>
        </div>
        
        <div id="moduloResultado">
            <p></p>
            <h4 id = "resultadoLeyenda" class="oculto">Resultado del lanzamiento</h4>
            <p id="resultado"></p>
            <p id="mensajeResultado"></p>
            
            <h5 id = "cantidadFinalLeyenda" class="oculto">La cantidad de dinero acumulado es:</h5>
            <p id="cantidadFinal"></p>
            <p id="mensajeFinal"></p>
        </div>
        
        <button id= "botonJugarOtravez">Jugar otra vez</button>

    </div>
</body>
</html>
